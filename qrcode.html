<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR da Missão</title>
<script src="vendor/qrcode.min.js"></script>
<style>
:root{--azul:#465EFF;--amarelo:#FCFC30;--navy:#0B1340}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:#fff;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px}
.k{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--amarelo);font-weight:700}
h1{font-size:44px;margin:8px 0 6px;text-align:center;line-height:1.05}
p{color:#C9CEF0;margin:0 0 24px;text-align:center;max-width:520px}
#qr{background:#fff;padding:22px;border-radius:24px}
#qr img,#qr canvas{display:block;width:min(70vw,380px)!important;height:auto!important}
.cfg{margin-top:28px;width:100%;max-width:560px;display:flex;gap:8px}
.cfg input{flex:1;font:inherit;padding:12px;border-radius:12px;border:0}
.cfg button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--amarelo);color:var(--navy);cursor:pointer}
.av{margin-top:10px;font-size:13px;color:#FFB4B4;max-width:560px;text-align:center}
.url{margin-top:14px;font-size:14px;color:#AEB4DF;word-break:break-all;text-align:center}
@media print{body{background:#fff;color:#000}.k{color:#000}p,.url{color:#333}.cfg,.av{display:none}}
</style>
</head>
<body>
  <div class="k">Workshop · Experiência do cliente</div>
  <h1>Missão Cliente</h1>
  <p>Aponte a câmera do celular, receba sua missão e viva a jornada de um cliente.</p>
  <div id="qr"></div>
  <div class="url" id="url"></div>
  <div class="cfg"><input id="in" aria-label="Endereço da página de missões"><button id="go">Gerar QR</button><button onclick="print()">Imprimir</button></div>
  <div class="av" id="av"></div>
<script>
const inp=document.getElementById('in');
inp.value=new URL('./',location.href).href;
function gerar(){
  const u=inp.value.trim();
  document.getElementById('qr').innerHTML='';
  new QRCode(document.getElementById('qr'),{text:u,width:512,height:512,correctLevel:QRCode.CorrectLevel.M});
  document.getElementById('url').textContent=u;
  document.getElementById('av').textContent=/^file:|localhost|127\.0\.0\.1/.test(u)
    ? 'Atenção: este endereço só funciona neste computador. Publique o index.html num servidor acessível pelos celulares e cole o endereço público aqui.' : '';
}
document.getElementById('go').onclick=gerar;
inp.addEventListener('keydown',e=>{ if(e.key==='Enter') gerar(); });
gerar();
// Aberto pelo próprio computador do servidor: troca "localhost" pelo IP da rede, que os celulares conseguem acessar
if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){
  fetch('api/info').then(r=>r.json()).then(i=>{ if(i.ips&&i.ips.length){ inp.value=`${location.protocol}//${i.ips[0]}:${i.porta}/`; gerar(); } }).catch(()=>{});
}
</script>
</body>
</html>
